<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" width="700" height="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif">
  <rect width="700" height="340" fill="#ffffff"/>

  <!-- ===== 텀블링 윈도 ===== -->
  <text x="20" y="28" font-size="14" font-weight="700" fill="#1f2328">텀블링(고정) 윈도 — 클릭 수 집계에 사용</text>
  <text x="20" y="46" font-size="11" fill="#656d76">겹치지 않는 1분 블록. 각 이벤트는 정확히 한 윈도에만 속한다.</text>

  <rect x="60"  y="60" width="140" height="34" rx="3" fill="#0969da" fill-opacity="0.12" stroke="#0969da"/>
  <rect x="200" y="60" width="140" height="34" rx="3" fill="#0969da" fill-opacity="0.12" stroke="#0969da"/>
  <rect x="340" y="60" width="140" height="34" rx="3" fill="#0969da" fill-opacity="0.12" stroke="#0969da"/>
  <rect x="480" y="60" width="140" height="34" rx="3" fill="#0969da" fill-opacity="0.12" stroke="#0969da"/>
  <text x="130" y="82" font-size="11" fill="#0969da" text-anchor="middle">00:00 ~ 00:01</text>
  <text x="270" y="82" font-size="11" fill="#0969da" text-anchor="middle">00:01 ~ 00:02</text>
  <text x="410" y="82" font-size="11" fill="#0969da" text-anchor="middle">00:02 ~ 00:03</text>
  <text x="550" y="82" font-size="11" fill="#0969da" text-anchor="middle">00:03 ~ 00:04</text>

  <line x1="50" y1="112" x2="665" y2="112" stroke="#656d76" stroke-width="1.5"/>
  <polygon points="665,112 656,108 656,116" fill="#656d76"/>
  <text x="640" y="130" font-size="11" fill="#656d76">시간</text>
  <circle cx="110" cy="112" r="5" fill="#1a7f37"/>
  <circle cx="165" cy="112" r="5" fill="#1a7f37"/>
  <circle cx="250" cy="112" r="5" fill="#1a7f37"/>
  <circle cx="395" cy="112" r="5" fill="#1a7f37"/>
  <circle cx="520" cy="112" r="5" fill="#1a7f37"/>

  <line x1="20" y1="152" x2="680" y2="152" stroke="#d0d7de"/>

  <!-- ===== 슬라이딩 윈도 ===== -->
  <text x="20" y="180" font-size="14" font-weight="700" fill="#1f2328">슬라이딩 윈도 — 최근 M분 상위 N개 광고에 사용</text>
  <text x="20" y="198" font-size="11" fill="#656d76">3분 폭 윈도가 1분씩 이동. 구간이 겹치므로 같은 이벤트가 여러 윈도에 포함된다.</text>

  <rect x="60"  y="212" width="280" height="26" rx="3" fill="#8250df" fill-opacity="0.14" stroke="#8250df"/>
  <text x="350" y="229" font-size="11" fill="#8250df">윈도 A: 00:00 ~ 00:03</text>

  <rect x="130" y="244" width="280" height="26" rx="3" fill="#8250df" fill-opacity="0.14" stroke="#8250df"/>
  <text x="420" y="261" font-size="11" fill="#8250df">윈도 B: 00:01 ~ 00:04</text>

  <rect x="200" y="276" width="280" height="26" rx="3" fill="#8250df" fill-opacity="0.14" stroke="#8250df"/>
  <text x="490" y="293" font-size="11" fill="#8250df">윈도 C: 00:02 ~ 00:05</text>

  <line x1="50" y1="320" x2="665" y2="320" stroke="#656d76" stroke-width="1.5"/>
  <polygon points="665,320 656,316 656,324" fill="#656d76"/>
  <line x1="60"  y1="212" x2="60"  y2="320" stroke="#8250df" stroke-width="0.8" stroke-dasharray="2 3"/>
  <line x1="130" y1="244" x2="130" y2="320" stroke="#8250df" stroke-width="0.8" stroke-dasharray="2 3"/>
  <line x1="200" y1="276" x2="200" y2="320" stroke="#8250df" stroke-width="0.8" stroke-dasharray="2 3"/>
  <text x="640" y="338" font-size="11" fill="#656d76">시간</text>
</svg>
