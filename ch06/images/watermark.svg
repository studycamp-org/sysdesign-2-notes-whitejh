<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" width="700" height="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif">
  <rect width="700" height="330" fill="#ffffff"/>

  <!-- ===== 상단: 워터마크 없음 ===== -->
  <text x="20" y="30" font-size="14" font-weight="700" fill="#cf222e">① 워터마크 없음 — 지연 이벤트가 윈도를 놓친다</text>

  <!-- 윈도 박스 -->
  <rect x="60" y="48" width="180" height="38" fill="#0969da" fill-opacity="0.08" stroke="#0969da" stroke-dasharray="4 3"/>
  <rect x="240" y="48" width="180" height="38" fill="#0969da" fill-opacity="0.08" stroke="#0969da" stroke-dasharray="4 3"/>
  <rect x="420" y="48" width="180" height="38" fill="#0969da" fill-opacity="0.08" stroke="#0969da" stroke-dasharray="4 3"/>
  <text x="150" y="72" font-size="12" fill="#0969da" text-anchor="middle">윈도 1 (1분)</text>
  <text x="330" y="72" font-size="12" fill="#0969da" text-anchor="middle">윈도 2</text>
  <text x="510" y="72" font-size="12" fill="#0969da" text-anchor="middle">윈도 3</text>

  <!-- 축 -->
  <line x1="50" y1="100" x2="665" y2="100" stroke="#656d76" stroke-width="1.5"/>
  <polygon points="665,100 656,96 656,104" fill="#656d76"/>
  <text x="640" y="120" font-size="11" fill="#656d76">시간</text>

  <!-- 이벤트 1: 정상 집계 -->
  <circle cx="140" cy="100" r="7" fill="#1a7f37"/>
  <text x="140" y="138" font-size="11" fill="#1a7f37" text-anchor="middle">이벤트 1</text>
  <text x="140" y="152" font-size="10" fill="#656d76" text-anchor="middle">제때 도착 → 집계됨</text>

  <!-- 이벤트 2: 누락 -->
  <circle cx="275" cy="100" r="7" fill="#cf222e"/>
  <line x1="140" y1="100" x2="275" y2="100" stroke="#cf222e" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="300" y="138" font-size="11" fill="#cf222e" text-anchor="middle">이벤트 2 (지연 도착)</text>
  <text x="300" y="152" font-size="10" fill="#cf222e" text-anchor="middle">이벤트 시각은 윈도 1 → 이미 닫혀 누락</text>

  <!-- 구분선 -->
  <line x1="20" y1="178" x2="680" y2="178" stroke="#d0d7de"/>

  <!-- ===== 하단: 워터마크 적용 ===== -->
  <text x="20" y="206" font-size="14" font-weight="700" fill="#1a7f37">② 워터마크 적용 — 윈도를 조금 연장해 지연 이벤트를 흡수</text>

  <rect x="60" y="224" width="180" height="38" fill="#0969da" fill-opacity="0.08" stroke="#0969da" stroke-dasharray="4 3"/>
  <!-- 워터마크 연장 구간 -->
  <rect x="240" y="224" width="55" height="38" fill="#bf8700" fill-opacity="0.22" stroke="#9a6700" stroke-dasharray="3 2"/>
  <rect x="295" y="224" width="125" height="38" fill="#0969da" fill-opacity="0.08" stroke="#0969da" stroke-dasharray="4 3"/>
  <rect x="420" y="224" width="180" height="38" fill="#0969da" fill-opacity="0.08" stroke="#0969da" stroke-dasharray="4 3"/>
  <text x="150" y="248" font-size="12" fill="#0969da" text-anchor="middle">윈도 1 (1분)</text>
  <text x="357" y="248" font-size="12" fill="#0969da" text-anchor="middle">윈도 2</text>
  <text x="510" y="248" font-size="12" fill="#0969da" text-anchor="middle">윈도 3</text>

  <line x1="50" y1="276" x2="665" y2="276" stroke="#656d76" stroke-width="1.5"/>
  <polygon points="665,276 656,272 656,280" fill="#656d76"/>

  <circle cx="140" cy="276" r="7" fill="#1a7f37"/>
  <circle cx="275" cy="276" r="7" fill="#1a7f37"/>
  <line x1="140" y1="276" x2="275" y2="276" stroke="#1a7f37" stroke-width="2" stroke-dasharray="3 3"/>

  <!-- 워터마크 라벨 -->
  <text x="267" y="216" font-size="11" font-weight="700" fill="#9a6700" text-anchor="middle">워터마크</text>
  <text x="300" y="300" font-size="11" fill="#1a7f37" text-anchor="middle">이벤트 2도 윈도 1에 집계됨</text>
  <text x="300" y="316" font-size="10" fill="#656d76" text-anchor="middle">길게 잡으면 누락 ↓ · 지연 ↑ / 짧게 잡으면 누락 ↑ · 지연 ↓</text>
</svg>
