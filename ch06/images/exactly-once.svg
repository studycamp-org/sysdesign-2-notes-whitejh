<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" width="700" height="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#656d76"/>
    </marker>
    <marker id="r" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#cf222e"/>
    </marker>
  </defs>
  <rect width="700" height="340" fill="#ffffff"/>

  <!-- ===== 문제 ===== -->
  <text x="20" y="26" font-size="14" font-weight="700" fill="#cf222e">① 문제 — 오프셋 커밋 전에 노드가 죽으면 같은 클릭이 두 번 집계된다</text>

  <text x="24" y="58" font-size="10" fill="#656d76">Kafka 파티션 (오프셋)</text>
  <rect x="24"  y="66" width="40" height="32" fill="#f6f8fa" stroke="#afb8c1"/>
  <rect x="64"  y="66" width="40" height="32" fill="#f6f8fa" stroke="#afb8c1"/>
  <rect x="104" y="66" width="40" height="32" fill="#cf222e" fill-opacity="0.14" stroke="#cf222e"/>
  <rect x="144" y="66" width="40" height="32" fill="#f6f8fa" stroke="#afb8c1"/>
  <text x="44"  y="87" font-size="11" fill="#656d76" text-anchor="middle">98</text>
  <text x="84"  y="87" font-size="11" fill="#656d76" text-anchor="middle">99</text>
  <text x="124" y="87" font-size="11" font-weight="700" fill="#cf222e" text-anchor="middle">100</text>
  <text x="164" y="87" font-size="11" fill="#656d76" text-anchor="middle">101</text>

  <line x1="190" y1="82" x2="250" y2="82" stroke="#656d76" marker-end="url(#a)"/>

  <rect x="253" y="58" width="120" height="48" rx="4" fill="#0969da" fill-opacity="0.08" stroke="#0969da"/>
  <text x="313" y="87" font-size="11" fill="#0969da" text-anchor="middle">집계 노드</text>

  <line x1="373" y1="82" x2="433" y2="82" stroke="#656d76" marker-end="url(#a)"/>
  <text x="403" y="74" font-size="9" fill="#656d76" text-anchor="middle">기록</text>

  <rect x="436" y="58" width="120" height="48" rx="4" fill="#f6f8fa" stroke="#656d76"/>
  <text x="496" y="87" font-size="11" fill="#1f2328" text-anchor="middle">다운스트림</text>

  <!-- 크래시 -->
  <path d="M305,112 L321,112 M313,104 L313,120" stroke="#cf222e" stroke-width="2.5" transform="rotate(45 313 112)"/>
  <text x="333" y="117" font-size="11" font-weight="600" fill="#cf222e">다운스트림에 쓴 직후, 오프셋 커밋 전 크래시</text>
  <text x="24" y="146" font-size="11" fill="#cf222e">→ 재시작하면 오프셋 100부터 다시 읽어 같은 클릭을 또 집계 (중복)</text>

  <line x1="20" y1="168" x2="680" y2="168" stroke="#d0d7de"/>

  <!-- ===== 해결 ===== -->
  <text x="20" y="196" font-size="14" font-weight="700" fill="#1a7f37">② 해결 — 결과 기록과 오프셋 저장을 하나의 원자적 커밋으로 묶는다</text>

  <rect x="24" y="238" width="180" height="48" rx="4" fill="#0969da" fill-opacity="0.08" stroke="#0969da"/>
  <text x="114" y="260" font-size="11" font-weight="600" fill="#0969da" text-anchor="middle">집계 노드</text>
  <text x="114" y="277" font-size="10" fill="#656d76" text-anchor="middle">오프셋 100 처리</text>

  <line x1="204" y1="262" x2="246" y2="262" stroke="#656d76" marker-end="url(#a)"/>

  <rect x="250" y="222" width="330" height="80" rx="6" fill="#1a7f37" fill-opacity="0.05" stroke="#1a7f37" stroke-dasharray="5 3"/>
  <text x="415" y="240" font-size="11" font-weight="700" fill="#1a7f37" text-anchor="middle">하나의 분산 트랜잭션 — 둘 다 성공하거나 둘 다 실패</text>
  <rect x="266" y="250" width="145" height="40" rx="4" fill="#ffffff" stroke="#1a7f37"/>
  <text x="338" y="275" font-size="11" fill="#1a7f37" text-anchor="middle">집계 결과 기록</text>
  <rect x="421" y="250" width="145" height="40" rx="4" fill="#ffffff" stroke="#1a7f37"/>
  <text x="493" y="275" font-size="11" fill="#1a7f37" text-anchor="middle">오프셋 저장</text>

  <text x="24" y="326" font-size="11" fill="#656d76">대안: 다운스트림이 집계 결과를 <tspan font-weight="700" fill="#1f2328">멱등하게</tspan> 처리하면 분산 트랜잭션 없이도 중복이 무해해진다</text>
</svg>
