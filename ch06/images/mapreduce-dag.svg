<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" width="700" height="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#656d76"/>
    </marker>
    <marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#afb8c1"/>
    </marker>
  </defs>
  <rect width="700" height="340" fill="#ffffff"/>

  <text x="20" y="26" font-size="14" font-weight="700" fill="#1f2328">집계 서비스 — MapReduce / DAG</text>
  <text x="20" y="45" font-size="11" fill="#656d76">맵이 ad_id로 분배 → 집계 노드가 1분간 메모리에서 카운트 → 리듀스가 병합</text>

  <!-- Kafka -->
  <rect x="20" y="140" width="95" height="56" rx="4" fill="#f6f8fa" stroke="#656d76"/>
  <text x="67" y="163" font-size="12" font-weight="600" fill="#1f2328" text-anchor="middle">Kafka #1</text>
  <text x="67" y="180" font-size="10" fill="#656d76" text-anchor="middle">원시 클릭</text>

  <!-- Map nodes -->
  <rect x="155" y="80" width="110" height="56" rx="4" fill="#0969da" fill-opacity="0.08" stroke="#0969da"/>
  <text x="210" y="103" font-size="12" font-weight="600" fill="#0969da" text-anchor="middle">맵 노드 1</text>
  <text x="210" y="120" font-size="10" fill="#656d76" text-anchor="middle">필터링 · 변환</text>
  <rect x="155" y="200" width="110" height="56" rx="4" fill="#0969da" fill-opacity="0.08" stroke="#0969da"/>
  <text x="210" y="223" font-size="12" font-weight="600" fill="#0969da" text-anchor="middle">맵 노드 2</text>
  <text x="210" y="240" font-size="10" fill="#656d76" text-anchor="middle">필터링 · 변환</text>

  <!-- Aggregation nodes -->
  <rect x="315" y="60" width="140" height="50" rx="4" fill="#1a7f37" fill-opacity="0.08" stroke="#1a7f37"/>
  <text x="385" y="80" font-size="12" font-weight="600" fill="#1a7f37" text-anchor="middle">집계 노드 0</text>
  <text x="385" y="97" font-size="10" fill="#656d76" text-anchor="middle">ad_id % 3 == 0</text>
  <rect x="315" y="140" width="140" height="50" rx="4" fill="#1a7f37" fill-opacity="0.08" stroke="#1a7f37"/>
  <text x="385" y="160" font-size="12" font-weight="600" fill="#1a7f37" text-anchor="middle">집계 노드 1</text>
  <text x="385" y="177" font-size="10" fill="#656d76" text-anchor="middle">ad_id % 3 == 1</text>
  <rect x="315" y="220" width="140" height="50" rx="4" fill="#1a7f37" fill-opacity="0.08" stroke="#1a7f37"/>
  <text x="385" y="240" font-size="12" font-weight="600" fill="#1a7f37" text-anchor="middle">집계 노드 2</text>
  <text x="385" y="257" font-size="10" fill="#656d76" text-anchor="middle">ad_id % 3 == 2</text>

  <!-- Reduce -->
  <rect x="495" y="140" width="90" height="56" rx="4" fill="#8250df" fill-opacity="0.10" stroke="#8250df"/>
  <text x="540" y="163" font-size="12" font-weight="600" fill="#8250df" text-anchor="middle">리듀스</text>
  <text x="540" y="180" font-size="10" fill="#656d76" text-anchor="middle">결과 병합</text>

  <!-- Output -->
  <rect x="615" y="140" width="70" height="56" rx="4" fill="#f6f8fa" stroke="#656d76"/>
  <text x="650" y="163" font-size="11" font-weight="600" fill="#1f2328" text-anchor="middle">Kafka #2</text>
  <text x="650" y="180" font-size="10" fill="#656d76" text-anchor="middle">집계 결과</text>

  <!-- Kafka -> Map -->
  <line x1="115" y1="158" x2="152" y2="112" stroke="#656d76" marker-end="url(#a)"/>
  <line x1="115" y1="178" x2="152" y2="224" stroke="#656d76" marker-end="url(#a)"/>

  <!-- Map -> Agg (shuffle) -->
  <line x1="265" y1="100" x2="312" y2="88"  stroke="#afb8c1" marker-end="url(#b)"/>
  <line x1="265" y1="108" x2="312" y2="160" stroke="#afb8c1" marker-end="url(#b)"/>
  <line x1="265" y1="116" x2="312" y2="238" stroke="#afb8c1" marker-end="url(#b)"/>
  <line x1="265" y1="220" x2="312" y2="94"  stroke="#afb8c1" marker-end="url(#b)"/>
  <line x1="265" y1="228" x2="312" y2="170" stroke="#afb8c1" marker-end="url(#b)"/>
  <line x1="265" y1="236" x2="312" y2="248" stroke="#afb8c1" marker-end="url(#b)"/>

  <!-- Agg -> Reduce -->
  <line x1="455" y1="88"  x2="492" y2="152" stroke="#656d76" marker-end="url(#a)"/>
  <line x1="455" y1="165" x2="492" y2="167" stroke="#656d76" marker-end="url(#a)"/>
  <line x1="455" y1="242" x2="492" y2="184" stroke="#656d76" marker-end="url(#a)"/>

  <!-- Reduce -> Out -->
  <line x1="585" y1="168" x2="612" y2="168" stroke="#656d76" marker-end="url(#a)"/>

  <text x="288" y="300" font-size="10" fill="#afb8c1" text-anchor="middle">셔플</text>
  <text x="20" y="324" font-size="11" fill="#656d76">같은 ad_id는 항상 같은 집계 노드로 → 중간 데이터는 메모리, 노드 간 TCP·공유 메모리로 통신</text>
</svg>
